<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrito — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container">
  <a class="navbar-brand" href="catalogo.html">🌱 Agro Market ULEAM</a>
  <div class="navbar-nav ms-auto">
    <a class="nav-link" href="catalogo.html"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
      <i class="bi bi-person-circle"></i> <span id="usuario-nombre">...</span></a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
    </ul>
  </div>
</div></nav>
<main class="container py-4">
  <h4 class="fw-bold text-success mb-4">🛒 Tu Carrito</h4>
  <div id="contenido-carrito">
    <div class="text-center py-5"><div class="spinner-border text-success"></div></div>
  </div>
</main>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script>
  protegerPagina(["cliente","administrador"]);
  const MINIMO_DELIVERY = 2.00;

  async function iniciarPagina() {
    cargarNavbar();
    const carrito = JSON.parse(localStorage.getItem("carrito") || "{}");
    const ids = Object.keys(carrito);
    if (!ids.length) {
      document.getElementById("contenido-carrito").innerHTML =
        `<div class="text-center py-5"><span style="font-size:4rem">🛒</span>
         <p class="text-muted mt-2">Tu carrito está vacío.</p>
         <a href="catalogo.html" class="btn btn-success">Ver catálogo</a></div>`;
      return;
    }
    const items = []; let subtotal = 0;
    for (const id of ids) {
      const prod = await obtenerProducto(id);
      if (prod && prod.activo) {
        const total = prod.precio * carrito[id];
        items.push({ prod, cantidad: carrito[id], total });
        subtotal += total;
      }
    }
    renderCarrito(items, subtotal);
  }

  function renderCarrito(items, subtotal) {
    document.getElementById("contenido-carrito").innerHTML = `
      <div class="row">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <table class="table mb-0 align-middle">
              <thead class="table-success"><tr>
                <th>Producto</th><th class="text-center">Precio</th>
                <th class="text-center">Cantidad</th><th class="text-end">Subtotal</th><th></th>
              </tr></thead>
              <tbody>
                ${items.map(it => `<tr>
                  <td><div class="fw-semibold">${it.prod.nombre}</div>
                      <small class="text-muted">${it.prod.unidad}</small></td>
                  <td class="text-center">${fmt(it.prod.precio)}</td>
                  <td class="text-center">${it.cantidad}</td>
                  <td class="text-end fw-bold text-success">${fmt(it.total)}</td>
                  <td><button class="btn btn-outline-danger btn-sm"
                      onclick="eliminarItem('${it.prod.id}')">
                    <i class="bi bi-trash"></i></button></td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
          <div class="mt-2">
            <button class="btn btn-outline-danger btn-sm"
                    onclick="if(confirm('¿Vaciar el carrito?')){localStorage.removeItem('carrito');location.reload();}">
              <i class="bi bi-trash"></i> Vaciar carrito</button>
          </div>
        </div>
        <div class="col-lg-4 mt-3 mt-lg-0">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h6 class="fw-bold mb-3">Resumen</h6>
              <div class="d-flex justify-content-between mb-3">
                <span>Subtotal</span><span class="fw-bold">${fmt(subtotal)}</span>
              </div>
              ${subtotal < MINIMO_DELIVERY
                ? `<div class="alert alert-warning small p-2">
                     Mínimo para delivery: <strong>${fmt(MINIMO_DELIVERY)}</strong></div>`
                : ""}
              <a href="checkout.html" class="btn btn-success w-100 fw-bold">
                Confirmar pedido <i class="bi bi-arrow-right"></i></a>
            </div>
          </div>
        </div>
      </div>`;
  }

  function eliminarItem(id) {
    const c = JSON.parse(localStorage.getItem("carrito") || "{}");
    delete c[id]; localStorage.setItem("carrito", JSON.stringify(c));
    location.reload();
  }
</script></body></html>
