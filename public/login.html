<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión — Agro Market ULEAM</title>
  <!-- Firebase SDK (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <span style="font-size:3.5rem">🌱</span>
          <h2 class="fw-bold text-success">Agro Market ULEAM</h2>
          <p class="text-muted">Inicia sesión con tu correo institucional</p>
        </div>
        <div id="error-msg" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Correo institucional</label>
          <input type="email" id="correo" class="form-control"
                 placeholder="usuario@uleam.edu.ec" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100 fw-bold" onclick="iniciarSesion()">Entrar</button>
        <hr>
        <p class="text-center mb-0">¿No tienes cuenta?
          <a href="registro.html" class="text-success fw-bold">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
<script>
  // Si ya hay sesión, redirigir
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      const datos = await obtenerUsuario(user.uid);
      if (!datos) return;
      if (datos.rol === "administrador") window.location.href = "admin/dashboard.html";
      else if (datos.rol === "repartidor") window.location.href = "repartidor/entregas.html";
      else window.location.href = "catalogo.html";
    }
  });

  async function iniciarSesion() {
    const correo   = document.getElementById("correo").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const errEl    = document.getElementById("error-msg");
    errEl.classList.add("d-none");

    if (!correo.endsWith(DOMINIO_ULEAM)) {
      errEl.textContent = `Solo se permiten correos ${DOMINIO_ULEAM}`;
      errEl.classList.remove("d-none"); return;
    }
    try {
      await auth.signInWithEmailAndPassword(correo, password);
    } catch (e) {
      errEl.textContent = "Correo o contraseña incorrectos.";
      errEl.classList.remove("d-none");
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") iniciarSesion();
  });
</script>
</body></html>
