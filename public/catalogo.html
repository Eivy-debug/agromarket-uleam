<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="catalogo.html">🌱 Agro Market ULEAM</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="catalogo.html"><i class="bi bi-shop"></i> Catálogo</a></li>
        <li class="nav-item"><a class="nav-link" href="mis-pedidos.html"><i class="bi bi-bag-check"></i> Mis Pedidos</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="carrito.html">
            <i class="bi bi-cart3"></i> Carrito
            <span id="carrito-badge" class="badge bg-danger" style="display:none">0</span>
          </a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i> <span id="usuario-nombre">...</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text text-muted small" id="usuario-rol"></span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">
              <i class="bi bi-box-arrow-right"></i> Cerrar sesión</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-success mb-0">🛒 Catálogo de Productos</h4>
  </div>
  <!-- FILTROS -->
  <div class="row g-2 mb-4">
    <div class="col-md-5">
      <input type="text" id="busqueda" class="form-control" placeholder="Buscar producto..."
             oninput="filtrar()">
    </div>
    <div class="col-md-4">
      <select id="categoria-filtro" class="form-select" onchange="filtrar()">
        <option value="">Todas las categorías</option>
      </select>
    </div>
  </div>
  <!-- PRODUCTOS -->
  <div id="productos-grid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-success"></div>
    </div>
  </div>
</main>
<!-- MODAL AGREGAR AL CARRITO -->
<div class="modal fade" id="modalAgregar" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h6 class="modal-title" id="modal-nombre-prod">Agregar al carrito</h6>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Cantidad</label>
        <input type="number" id="modal-cantidad" class="form-control" value="1" min="1">
        <div class="text-muted small mt-1">Disponible: <span id="modal-stock">0</span></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="agregarAlCarrito()">Agregar</button>
      </div>
    </div>
  </div>
</div>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script>
  let todosProductos = [];
  let productoSeleccionado = null;

  protegerPagina(["cliente", "administrador"]);

  async function iniciarPagina() {
    cargarNavbar();
    actualizarBadgeCarrito();
    // Cargar categorías en el filtro
    const cats = await listarCategorias();
    const sel = document.getElementById("categoria-filtro");
    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id; opt.textContent = c.nombre;
      sel.appendChild(opt);
    });
    // Cargar productos
    todosProductos = await listarProductos({ activo: true });
    renderProductos(todosProductos);
  }

  function filtrar() {
    const busqueda = document.getElementById("busqueda").value.toLowerCase();
    const catId    = document.getElementById("categoria-filtro").value;
    let filtrados  = todosProductos;
    if (busqueda) filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(busqueda));
    if (catId)    filtrados = filtrados.filter(p => p.categoria_id === catId);
    renderProductos(filtrados);
  }

  function renderProductos(prods) {
    const grid = document.getElementById("productos-grid");
    if (!prods.length) {
      grid.innerHTML = `<div class="col-12 text-center py-5">
        <span style="font-size:4rem">🌿</span>
        <p class="text-muted mt-2">No se encontraron productos.</p></div>`;
      return;
    }
    grid.innerHTML = prods.map(p => `
      <div class="col">
        <div class="card h-100 shadow-sm border-0">
          ${p.imagen_url
            ? `<img src="${p.imagen_url}" class="card-img-top producto-img" alt="${p.nombre}">`
            : `<div class="producto-placeholder">🌿</div>`}
          <div class="card-body p-2">
            <h6 class="fw-bold mb-1">${p.nombre}</h6>
            <div class="d-flex justify-content-between align-items-center mt-1">
              <span class="text-success fw-bold">${fmt(p.precio)}</span>
              <small class="text-muted">/ ${p.unidad}</small>
            </div>
            ${p.stock_actual > 0
              ? `<small class="text-muted">Stock: ${p.stock_actual}</small>`
              : `<small class="text-danger fw-bold">Sin stock</small>`}
          </div>
          <div class="card-footer bg-white border-0 p-2">
            ${p.stock_actual > 0
              ? `<button class="btn btn-success btn-sm w-100"
                  onclick="abrirModal('${p.id}','${p.nombre}',${p.stock_actual})">
                  <i class="bi bi-cart-plus"></i> Agregar</button>`
              : `<button class="btn btn-secondary btn-sm w-100" disabled>Sin stock</button>`}
          </div>
        </div>
      </div>`).join("");
  }

  function abrirModal(id, nombre, stock) {
    productoSeleccionado = { id, stock };
    document.getElementById("modal-nombre-prod").textContent = nombre;
    document.getElementById("modal-stock").textContent = stock;
    document.getElementById("modal-cantidad").value = 1;
    document.getElementById("modal-cantidad").max = stock;
    new bootstrap.Modal(document.getElementById("modalAgregar")).show();
  }

  function agregarAlCarrito() {
    const cantidad = parseInt(document.getElementById("modal-cantidad").value);
    if (!productoSeleccionado || cantidad < 1) return;
    const carrito = JSON.parse(localStorage.getItem("carrito") || "{}");
    const nueva   = (carrito[productoSeleccionado.id] || 0) + cantidad;
    if (nueva > productoSeleccionado.stock) {
      mostrarToast("Stock insuficiente", "danger"); return;
    }
    carrito[productoSeleccionado.id] = nueva;
    localStorage.setItem("carrito", JSON.stringify(carrito));
    actualizarBadgeCarrito();
    bootstrap.Modal.getInstance(document.getElementById("modalAgregar")).hide();
    mostrarToast("Producto agregado al carrito ✓");
  }

  function actualizarBadgeCarrito() {
    const carrito = JSON.parse(localStorage.getItem("carrito") || "{}");
    const total   = Object.values(carrito).reduce((a,b) => a+b, 0);
    const badge   = document.getElementById("carrito-badge");
    if (badge) { badge.textContent = total; badge.style.display = total > 0 ? "inline" : "none"; }
  }
</script>
</body></html>
