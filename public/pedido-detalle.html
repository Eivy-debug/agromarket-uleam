<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detalle Pedido — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container">
  <a class="navbar-brand" href="catalogo.html">🌱 Agro Market ULEAM</a>
  <div class="navbar-nav ms-auto">
    <a class="nav-link" href="mis-pedidos.html"><i class="bi bi-arrow-left"></i> Mis Pedidos</a>
    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
      <i class="bi bi-person-circle"></i> <span id="usuario-nombre">...</span></a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
    </ul>
  </div>
</div></nav>
<main class="container py-4">
  <div id="contenido"><div class="text-center py-5"><div class="spinner-border text-success"></div></div></div>
</main>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script>
  protegerPagina(["cliente","administrador","repartidor"]);
  async function iniciarPagina() {
    cargarNavbar();
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    if (!id) { location.href="mis-pedidos.html"; return; }
    const pedido = await obtenerPedido(id);
    const u = await obtenerUsuarioActual();
    if (!pedido || (pedido.cliente_id!==u.id && !["administrador","repartidor"].includes(u.rol))) {
      location.href="mis-pedidos.html"; return;
    }
    const zona = pedido.zona_id ? await obtenerZona(pedido.zona_id) : null;
    document.getElementById("contenido").innerHTML = `
      <div class="d-flex align-items-center gap-2 mb-4">
        <a href="mis-pedidos.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold text-success mb-0">Pedido #${id.slice(0,8).toUpperCase()}</h4>
        <span class="badge bg-${COLORES_ESTADO[pedido.estado]} fs-6">${ETIQUETAS_ESTADO[pedido.estado]}</span>
      </div>
      <div class="row">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-success text-white fw-bold">Productos</div>
            <table class="table mb-0">
              <thead class="table-light"><tr><th>Producto</th><th class="text-center">Cant.</th>
                <th class="text-end">Precio</th><th class="text-end">Subtotal</th></tr></thead>
              <tbody>${(pedido.detalles||[]).map(d=>`<tr>
                <td>${d.nombre_producto}</td>
                <td class="text-center">${d.cantidad} ${d.unidad}</td>
                <td class="text-end">${fmt(d.precio_unitario)}</td>
                <td class="text-end fw-bold">${fmt(d.subtotal)}</td></tr>`).join("")}
              </tbody>
              <tfoot class="table-light">
                <tr><td colspan="3" class="text-end">Subtotal</td><td class="text-end">${fmt(pedido.subtotal)}</td></tr>
                ${pedido.tipo==="delivery"?`<tr><td colspan="3" class="text-end">Envío ${zona?"("+zona.nombre+")":""}</td><td class="text-end">${fmt(pedido.tarifa_envio)}</td></tr>`:""}
                <tr class="fw-bold text-success"><td colspan="3" class="text-end">Total</td><td class="text-end">${fmt(pedido.total)}</td></tr>
              </tfoot>
            </table>
          </div>
          <div class="card shadow-sm border-0">
            <div class="card-header bg-light fw-bold">Historial del pedido</div>
            <div class="card-body">
              ${(pedido.historial||[]).map(h=>`
                <div class="d-flex gap-2 mb-2">
                  <span class="badge bg-secondary align-self-start mt-1">${ETIQUETAS_ESTADO[h.estado_nuevo]||h.estado_nuevo}</span>
                  <div><small class="text-muted">${h.fecha?.slice(0,16).replace("T"," ")||""}</small>
                    ${h.nota?`<div class="small">${h.nota}</div>`:""}
                  </div>
                </div>`).join("")}
            </div>
          </div>
        </div>
        <div class="col-lg-4 mt-3 mt-lg-0">
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-light fw-bold">Información</div>
            <div class="card-body">
              <p class="mb-1"><strong>Tipo:</strong> ${pedido.tipo==="delivery"?"🚴 Delivery":"🏪 Retiro"}</p>
              ${pedido.direccion_entrega?`<p class="mb-1"><strong>Dirección:</strong> ${pedido.direccion_entrega}</p>`:""}
              <p class="mb-1"><strong>Pago:</strong> ${pedido.forma_pago==="efectivo"?"💵 Efectivo":"🏦 Transferencia"}</p>
              ${pedido.comprobante_url?`<a href="${pedido.comprobante_url}" target="_blank" class="btn btn-outline-secondary btn-sm mt-1"><i class="bi bi-image"></i> Ver comprobante</a>`:""}
            </div>
          </div>
          ${pedido.estado==="pendiente" && pedido.cliente_id===u.id ? `
          <button class="btn btn-outline-danger w-100" onclick="cancelarPedido('${id}')">
            <i class="bi bi-x-circle"></i> Cancelar pedido</button>` : ""}
        </div>
      </div>`;
  }

  async function cancelarPedido(id) {
    if (!confirm("¿Cancelar este pedido?")) return;
    const pedido = await obtenerPedido(id);
    const u = await obtenerUsuarioActual();
    try {
      await cambiarEstadoPedido(id, pedido, "cancelado", u.id, "Cancelado por el cliente");
      for (const d of pedido.detalles||[]) {
        await agregarStock(d.producto_id, d.cantidad, "Devolución cancelación", u.id);
      }
      mostrarToast("Pedido cancelado. Stock devuelto.");
      setTimeout(() => location.reload(), 1500);
    } catch(e) { mostrarToast(e.message, "danger"); }
  }
</script></body></html>
