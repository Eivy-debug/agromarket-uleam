<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><link rel="stylesheet" href="../css/style.css"></head><body>

      <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">

<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-success mb-0">🌿 Gestión de Productos</h4>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevo">
      <i class="bi bi-plus-lg"></i> Nuevo producto</button>
  </div>
  <div class="card shadow-sm border-0">
    <div id="tabla"><div class="p-4 text-center"><div class="spinner-border text-success"></div></div></div>
  </div>
</div>

<!-- MODAL NUEVO PRODUCTO -->
<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog modal-lg">
  <div class="modal-content">
    <div class="modal-header bg-success text-white">
      <h5 class="modal-title">Nuevo Producto</h5>
      <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nombre *</label>
          <input type="text" id="np-nombre" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Precio *</label>
          <div class="input-group"><span class="input-group-text">$</span>
            <input type="number" id="np-precio" class="form-control" step="0.01" min="0"></div></div>
        <div class="col-md-3"><label class="form-label">Unidad *</label>
          <select id="np-unidad" class="form-select">
            <option value="unidad">Unidad</option><option value="kg">Kilogramo (kg)</option>
            <option value="lb">Libra (lb)</option><option value="litro">Litro</option>
            <option value="manojo">Manojo</option><option value="docena">Docena</option>
          </select></div>
        <div class="col-md-6"><label class="form-label">Categoría *</label>
          <select id="np-cat" class="form-select"></select></div>
        <div class="col-md-3"><label class="form-label">Stock inicial</label>
          <input type="number" id="np-stock" class="form-control" value="0" min="0"></div>
        <div class="col-md-3"><label class="form-label">Stock mínimo</label>
          <input type="number" id="np-stock-min" class="form-control" value="5" min="0"></div>
        <div class="col-12"><label class="form-label">Descripción</label>
          <textarea id="np-desc" class="form-control" rows="2"></textarea></div>
        <div class="col-md-6"><label class="form-label">Imagen</label>
          <input type="file" id="np-img" class="form-control" accept="image/*"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-success" onclick="guardarProducto()">Guardar</button>
    </div>
  </div>
</div></div>

<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script>
  let categorias = [];
  protegerPagina(["administrador"]);
  async function iniciarPagina() {
    cargarNavbar();
    categorias = await listarCategorias();
    const sel = document.getElementById("np-cat");
    categorias.forEach(c=>{ const o=document.createElement("option"); o.value=c.id; o.textContent=c.nombre; sel.appendChild(o); });
    cargarProductos();
  }
  async function cargarProductos() {
    const prods = await listarProductos({});
    const catMap = Object.fromEntries(categorias.map(c=>[c.id,c.nombre]));
    document.getElementById("tabla").innerHTML = prods.length ? `
      <table class="table mb-0 align-middle table-hover">
        <thead class="table-success"><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th class="text-center">Stock</th><th class="text-center">Estado</th><th class="text-center">Acciones</th></tr></thead>
        <tbody>${prods.map(p=>`<tr class="${p.activo?"":"table-light text-muted"}">
          <td><div class="d-flex align-items-center gap-2">
            ${p.imagen_url?`<img src="${p.imagen_url}" width="40" height="40" style="object-fit:cover;border-radius:6px;opacity:${p.activo?1:0.4}">`:`<span style="opacity:${p.activo?1:0.4}">🌿</span>`}
            <div><div class="fw-semibold">${p.nombre}</div><small class="text-muted">${p.unidad}</small></div>
          </div></td>
          <td><small>${catMap[p.categoria_id]||"—"}</small></td>
          <td class="fw-bold text-success">${fmt(p.precio)}</td>
          <td class="text-center">
            <span class="${p.stock_actual<=0?"text-danger fw-bold":p.stock_actual<=p.stock_minimo?"text-warning fw-bold":"text-success"}">${p.stock_actual}</span>
            ${p.stock_actual<=0?'<span class="badge bg-danger ms-1">agotado</span>':p.stock_actual<=p.stock_minimo?'<span class="badge bg-warning text-dark ms-1">bajo</span>':""}
          </td>
          <td class="text-center"><span class="badge bg-${p.activo?"success":"secondary"}">${p.activo?"Activo":"Inactivo"}</span></td>
          <td class="text-center">
            <div class="d-flex justify-content-center gap-1">
              <button class="btn btn-outline-${p.activo?"warning":"success"} btn-sm"
                onclick="toggleProd('${p.id}',${p.activo})" title="${p.activo?"Desactivar":"Activar"}">
                <i class="bi bi-eye${p.activo?"-slash":""}"></i></button>
              <button class="btn btn-outline-success btn-sm" data-bs-toggle="modal"
                      data-bs-target="#ms-${p.id}" title="Agregar stock"><i class="bi bi-plus-circle"></i></button>
            </div>
            <div class="modal fade" id="ms-${p.id}" tabindex="-1"><div class="modal-dialog modal-sm"><div class="modal-content">
              <div class="modal-header bg-success text-white"><h6 class="modal-title">Stock — ${p.nombre}</h6>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
              <div class="modal-body">
                <label class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="qty-${p.id}" min="1" value="1">
                <div class="mt-2 text-muted small">Actual: <strong>${p.stock_actual}</strong> ${p.unidad}</div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success btn-sm" onclick="addStock('${p.id}','${p.nombre}',${p.activo})">Agregar</button>
              </div>
            </div></div></div>
          </td>
        </tr>`).join("")}</tbody>
      </table>` : `<p class="text-center text-muted p-4">No hay productos. Crea el primero.</p>`;
  }
  async function guardarProducto() {
    const u = await obtenerUsuarioActual();
    const archivo = document.getElementById("np-img").files[0];
    let imagen_url = null;
    if (archivo) imagen_url = await subirImagen(archivo, "productos");
    const stock = parseInt(document.getElementById("np-stock").value)||0;
    const ref = await crearProducto({
      nombre:       document.getElementById("np-nombre").value.trim(),
      descripcion:  document.getElementById("np-desc").value.trim(),
      precio:       parseFloat(document.getElementById("np-precio").value)||0,
      stock_actual: stock,
      stock_minimo: parseInt(document.getElementById("np-stock-min").value)||5,
      unidad:       document.getElementById("np-unidad").value,
      categoria_id: document.getElementById("np-cat").value,
      imagen_url
    });
    if (stock>0) await agregarStock(ref.id, stock, "Stock inicial", u.id);
    bootstrap.Modal.getInstance(document.getElementById("modalNuevo")).hide();
    mostrarToast("Producto creado ✓");
    cargarProductos();
  }
  async function toggleProd(id, activo) {
    await toggleProducto(id, activo);
    mostrarToast(`Producto ${activo?"desactivado":"activado"}`);
    cargarProductos();
  }
  async function addStock(id, nombre, activo) {
    const u   = await obtenerUsuarioActual();
    const qty = parseInt(document.getElementById(`qty-${id}`).value)||0;
    if (qty<1) return;
    await agregarStock(id, qty, "Entrada mercadería — Lodana", u.id);
    bootstrap.Modal.getInstance(document.getElementById(`ms-${id}`)).hide();
    mostrarToast(`+${qty} unidades agregadas a ${nombre}`);
    cargarProductos();
  }
</script></body></html>
