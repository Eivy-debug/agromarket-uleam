<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Usuarios — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><link rel="stylesheet" href="../css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container-fluid">
  <a class="navbar-brand" href="dashboard.html">🌱 Admin</a>
  <div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li><li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li><li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li><li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li><li class="nav-item"><a class="nav-link" href="zonas.html">Zonas</a></li></ul>
  <ul class="navbar-nav"><li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
      <i class="bi bi-person-circle"></i> <span id="usuario-nombre">...</span></a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
    </ul></li></ul></div>
</div></nav>
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-success mb-0">👥 Gestión de Usuarios</h4>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevo">
      <i class="bi bi-person-plus"></i> Nuevo usuario</button>
  </div>
  <div class="card shadow-sm border-0">
    <div id="tabla"><div class="p-4 text-center"><div class="spinner-border text-success"></div></div></div>
  </div>
  <div class="mt-3"><small class="text-muted"><kbd>Ctrl+Shift+A</kbd> — atajo para volver al panel admin</small></div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header bg-success text-white">
      <h5 class="modal-title">Crear Usuario</h5>
      <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Nombre *</label>
          <input type="text" id="nu-nombre" class="form-control" required></div>
        <div class="col-6"><label class="form-label">Apellido *</label>
          <input type="text" id="nu-apellido" class="form-control" required></div>
      </div>
      <div class="mt-2"><label class="form-label">Correo @uleam.edu.ec *</label>
        <input type="email" id="nu-correo" class="form-control" placeholder="usuario@uleam.edu.ec" required></div>
      <div class="mt-2"><label class="form-label">Teléfono</label>
        <input type="text" id="nu-tel" class="form-control" placeholder="0991234567"></div>
      <div class="mt-2"><label class="form-label">Contraseña temporal *</label>
        <input type="text" id="nu-pwd" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
        <div class="form-text">El usuario puede cambiarla después desde su perfil.</div></div>
      <div class="mt-2"><label class="form-label">Rol *</label>
        <select id="nu-rol" class="form-select">
          <option value="repartidor">🚴 Repartidor</option>
          <option value="administrador">⚙️ Administrador</option>
          <option value="cliente">👤 Cliente</option>
        </select></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-success" onclick="crearUsuario()">Crear</button>
    </div>
  </div>
</div></div>

<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script>
  protegerPagina(["administrador"]);
  async function iniciarPagina() {
    cargarNavbar();
    cargarUsuarios();
  }
  async function cargarUsuarios() {
    const usuarios = await listarUsuarios();
    const rolesBadge = {administrador:"bg-danger",repartidor:"bg-info text-dark",cliente:"bg-secondary"};
    document.getElementById("tabla").innerHTML = `
      <table class="table mb-0 align-middle table-hover">
        <thead class="table-success"><tr>
          <th>Nombre</th><th>Correo</th><th>Teléfono</th>
          <th class="text-center">Rol</th><th class="text-center">Estado</th><th class="text-center">Acciones</th>
        </tr></thead>
        <tbody>${usuarios.map(u=>`<tr class="${u.activo?"":"table-light text-muted"}">
          <td class="fw-semibold">${u.nombre} ${u.apellido}</td>
          <td><small>${u.correo}</small></td>
          <td><small>${u.telefono||"—"}</small></td>
          <td class="text-center"><span class="badge ${rolesBadge[u.rol]||"bg-secondary"}">${u.rol}</span></td>
          <td class="text-center"><span class="badge bg-${u.activo?"success":"secondary"}">${u.activo?"Activo":"Inactivo"}</span></td>
          <td class="text-center">
            <button class="btn btn-outline-${u.activo?"warning":"success"} btn-sm"
                    onclick="toggleUsuario('${u.id}',${u.activo})" title="${u.activo?"Desactivar":"Activar"}">
              <i class="bi bi-person-${u.activo?"slash":"check"}"></i></button>
          </td>
        </tr>`).join("")}</tbody>
      </table>`;
  }
  async function crearUsuario() {
    const correo = document.getElementById("nu-correo").value.trim().toLowerCase();
    const pwd    = document.getElementById("nu-pwd").value;
    if (!correo.endsWith("@uleam.edu.ec")) {
      mostrarToast("Solo correos @uleam.edu.ec","warning"); return;
    }
    try {
      // Crear en Firebase Auth con función secundaria temporal
      const cred = await auth.createUserWithEmailAndPassword(correo, pwd);
      await crearUsuarioDB(cred.user.uid, {
        nombre:   document.getElementById("nu-nombre").value.trim(),
        apellido: document.getElementById("nu-apellido").value.trim(),
        correo, telefono: document.getElementById("nu-tel").value.trim(),
        rol: document.getElementById("nu-rol").value
      });
      await auth.signOut();
      // Re-autenticar como admin (el admin ya no tiene sesión)
      mostrarToast("Usuario creado. Inicia sesión de nuevo como admin.","warning");
      setTimeout(()=>window.location.href="../login.html", 2000);
    } catch(e) {
      mostrarToast(e.message,"danger");
    }
  }
  async function toggleUsuario(uid, activo) {
    await actualizarUsuario(uid, {activo: !activo});
    mostrarToast(`Usuario ${activo?"desactivado":"activado"}`);
    cargarUsuarios();
  }
</script></body></html>
