<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categorías — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><link rel="stylesheet" href="../css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container-fluid">
  <a class="navbar-brand" href="dashboard.html">🌱 Admin</a>
  <div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li><li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li><li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li><li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li><li class="nav-item"><a class="nav-link" href="zonas.html">Zonas</a></li></ul>
  <ul class="navbar-nav"><li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
      <i class="bi bi-person-circle"></i> <span id="usuario-nombre">...</span></a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
    </ul></li></ul></div>
</div></nav>
<div class="container-fluid py-4">
  <h4 class="fw-bold text-success mb-3">📂 Categorías</h4>
  <div class="row">
    <div class="col-md-5">
      <div class="card shadow-sm border-0 mb-3">
        <div class="card-header bg-success text-white fw-bold">Nueva categoría</div>
        <div class="card-body">
          <div class="mb-3"><label class="form-label">Nombre</label>
            <input type="text" id="cat-nombre" class="form-control" placeholder="Ej: Frutas"></div>
          <div class="mb-3"><label class="form-label">Descripción</label>
            <input type="text" id="cat-desc" class="form-control"></div>
          <button class="btn btn-success w-100" onclick="guardarCat()">Agregar</button>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="card shadow-sm border-0">
        <div id="tabla-cats"><div class="p-4 text-center"><div class="spinner-border text-success"></div></div></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script>
  protegerPagina(["administrador"]);
  async function iniciarPagina() { cargarNavbar(); cargarCats(); }
  async function cargarCats() {
    const cats = await listarCategorias();
    document.getElementById("tabla-cats").innerHTML = `<table class="table mb-0">
      <thead class="table-success"><tr><th>Categoría</th><th>Descripción</th></tr></thead>
      <tbody>${cats.map(c=>`<tr><td class="fw-semibold">${c.nombre}</td>
        <td><small class="text-muted">${c.descripcion||"—"}</small></td></tr>`).join("")}</tbody>
    </table>`;
  }
  async function guardarCat() {
    const nombre = document.getElementById("cat-nombre").value.trim();
    if (!nombre) return;
    await crearCategoria(nombre, document.getElementById("cat-desc").value.trim());
    document.getElementById("cat-nombre").value="";
    document.getElementById("cat-desc").value="";
    mostrarToast(`Categoría "${nombre}" creada ✓`);
    cargarCats();
  }
</script></body></html>
