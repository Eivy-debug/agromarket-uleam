<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zonas Delivery — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><link rel="stylesheet" href="../css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success"><div class="container-fluid">
  <a class="navbar-brand" href="dashboard.html">🌱 Admin</a>
  <div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li><li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li><li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li><li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li><li class="nav-item"><a class="nav-link" href="zonas.html">Zonas</a></li></ul>
  <ul class="navbar-nav"><li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
      <i class="bi bi-person-circle"></i> <span id="usuario-nombre">...</span></a>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
    </ul></li></ul></div>
</div></nav>
<div class="container-fluid py-4">
  <h4 class="fw-bold text-success mb-3">🗺️ Zonas de Delivery</h4>
  <div class="row">
    <div class="col-md-5">
      <div class="card shadow-sm border-0 mb-3">
        <div class="card-header bg-success text-white fw-bold">Nueva zona</div>
        <div class="card-body">
          <div class="mb-3"><label class="form-label">Nombre</label>
            <input type="text" id="z-nombre" class="form-control" placeholder="Ej: Bloque D"></div>
          <div class="mb-3"><label class="form-label">Tarifa de envío</label>
            <div class="input-group"><span class="input-group-text">$</span>
              <input type="number" id="z-tarifa" class="form-control" step="0.25" min="0" value="0.50"></div></div>
          <div class="mb-3"><label class="form-label">Descripción</label>
            <input type="text" id="z-desc" class="form-control"></div>
          <button class="btn btn-success w-100" onclick="guardarZona()">Agregar</button>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="card shadow-sm border-0">
        <div id="tabla-zonas"><div class="p-4 text-center"><div class="spinner-border text-success"></div></div></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script>
  protegerPagina(["administrador"]);
  async function iniciarPagina() { cargarNavbar(); cargarZonas(); }
  async function cargarZonas() {
    const zonas = await listarZonas();
    document.getElementById("tabla-zonas").innerHTML = `<table class="table mb-0">
      <thead class="table-success"><tr><th>Zona</th><th>Descripción</th><th>Tarifa</th></tr></thead>
      <tbody>${zonas.map(z=>`<tr><td class="fw-semibold">${z.nombre}</td>
        <td><small class="text-muted">${z.descripcion||"—"}</small></td>
        <td class="fw-bold text-success">${fmt(z.tarifa)}</td></tr>`).join("")}</tbody>
    </table>`;
  }
  async function guardarZona() {
    const nombre = document.getElementById("z-nombre").value.trim();
    const tarifa = parseFloat(document.getElementById("z-tarifa").value)||0.50;
    if (!nombre) return;
    await crearZona(nombre, tarifa, document.getElementById("z-desc").value.trim());
    document.getElementById("z-nombre").value="";
    mostrarToast(`Zona "${nombre}" creada ✓`);
    cargarZonas();
  }
</script></body></html>
