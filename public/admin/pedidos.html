<div class="container-fluid py-4">
  <h4 class="fw-bold text-success mb-3">📋 Gestión de Pedidos</h4>
  <div class="d-flex gap-2 mb-3 flex-wrap">
    <select id="filtro-estado" class="form-select form-select-sm w-auto" onchange="cargarPedidos()">
      <option value="">Todos los estados</option>
      <option value="pendiente">Pendiente</option>
      <option value="confirmado">Confirmado</option>
      <option value="en_preparacion">En Preparación</option>
      <option value="en_camino">En Camino</option>
      <option value="listo_para_retirar">Listo para Retirar</option>
      <option value="entregado">Entregado</option>
      <option value="cancelado">Cancelado</option>
    </select>
  </div>
  <div class="card shadow-sm border-0">
    <div id="tabla"><div class="p-4 text-center"><div class="spinner-border text-success"></div></div></div>
  </div>
</div>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script>
  let repartidores = [];
  protegerPagina(["administrador"]);
  async function iniciarPagina() {
    cargarNavbar();
    repartidores = await listarUsuarios();
    repartidores = repartidores.filter(u=>u.rol==="repartidor"&&u.activo);
    cargarPedidos();
  }
  async function cargarPedidos() {
    const estado = document.getElementById("filtro-estado").value;
    const pedidos = await listarTodosPedidos(estado||null);
    const u = await obtenerUsuarioActual();
    document.getElementById("tabla").innerHTML = pedidos.length ? `
      <table class="table mb-0 align-middle table-hover">
        <thead class="table-success"><tr>
          <th>#</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Pago</th><th>Estado</th><th>Fecha</th><th>Acción</th>
        </tr></thead>
        <tbody>${pedidos.map((p,i)=>`<tr>
          <td class="fw-bold">${p.id.slice(0,6).toUpperCase()}</td>
          <td><small>${p.cliente_nombre||"—"}</small></td>
          <td>${p.tipo==="delivery"?"🚴 Delivery":"🏪 Retiro"}</td>
          <td class="fw-bold text-success">${fmt(p.total)}</td>
          <td><small>${p.forma_pago==="efectivo"?"💵":"🏦"} ${p.forma_pago}
            ${p.comprobante_url?`<a href="${p.comprobante_url}" target="_blank" class="ms-1"><i class="bi bi-image"></i></a>`:""}</small>
          </td>
          <td><span class="badge bg-${COLORES_ESTADO[p.estado]}">${ETIQUETAS_ESTADO[p.estado]}</span></td>
          <td><small>${p.created_at?.toDate?p.created_at.toDate().toLocaleDateString("es-EC"):"—"}</small></td>
          <td>
            <button class="btn btn-outline-success btn-sm" data-bs-toggle="modal"
                    data-bs-target="#mod${i}">Cambiar estado</button>
            <div class="modal fade" id="mod${i}" tabindex="-1"><div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Pedido #${p.id.slice(0,8).toUpperCase()}</h5>
                  <button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                  <p class="small text-muted mb-2">${p.direccion_entrega||"Retiro en local"}</p>
                  <div class="mb-3"><label class="form-label fw-bold">Nuevo estado</label>
                    <select class="form-select" id="sel-estado-${i}">
                      ${["confirmado","en_preparacion","en_camino","listo_para_retirar","entregado","cancelado"]
                        .map(e=>`<option value="${e}">${ETIQUETAS_ESTADO[e]}</option>`).join("")}
                    </select></div>
                  ${p.tipo==="delivery"?`<div class="mb-3"><label class="form-label">Asignar repartidor</label>
                    <select class="form-select" id="sel-rep-${i}">
                      <option value="">Sin asignar</option>
                      ${repartidores.map(r=>`<option value="${r.id}">${r.nombre} ${r.apellido}</option>`).join("")}
                    </select></div>`:"" }
                  <div class="mb-2"><label class="form-label">Nota</label>
                    <input type="text" class="form-control" id="nota-${i}"></div>
                </div>
                <div class="modal-footer">
                  <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                  <button class="btn btn-success" onclick="cambiarEstado('${p.id}',${i})">Confirmar</button>
                </div>
              </div></div></div>
          </td>
        </tr>`).join("")}</tbody>
      </table>` : `<p class="text-center text-muted p-4">No hay pedidos.</p>`;
  }
  async function cambiarEstado(pedidoId, i) {
    const pedido = await obtenerPedido(pedidoId);
    const nuevo  = document.getElementById(`sel-estado-${i}`).value;
    const nota   = document.getElementById(`nota-${i}`).value;
    const repEl  = document.getElementById(`sel-rep-${i}`);
    const u = await obtenerUsuarioActual();
    try {
      await cambiarEstadoPedido(pedidoId, pedido, nuevo, u.id, nota);
      if (repEl?.value) await asignarRepartidor(pedidoId, repEl.value);
      mostrarToast(`Estado actualizado a "${ETIQUETAS_ESTADO[nuevo]}"`);
      bootstrap.Modal.getInstance(document.getElementById(`mod${i}`)).hide();
      setTimeout(cargarPedidos, 800);
    } catch(e) { mostrarToast(e.message, "danger"); }
  }
</script></body></html>
