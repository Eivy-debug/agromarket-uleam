<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — Agro Market ULEAM</title>
  <!-- Firebase SDK (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="fw-bold text-success text-center mb-1">Crear cuenta</h2>
        <p class="text-center text-muted mb-3">Solo para estudiantes y docentes ULEAM</p>
        <div id="error-msg" class="alert alert-danger d-none"></div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Nombre *</label>
            <input type="text" id="nombre" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Apellido *</label>
            <input type="text" id="apellido" class="form-control" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Correo institucional *</label>
          <input type="email" id="correo" class="form-control"
                 placeholder="usuario@uleam.edu.ec" required>
          <div class="form-text">Solo se aceptan correos @uleam.edu.ec</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" id="telefono" class="form-control" placeholder="0991234567">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña *</label>
          <input type="password" id="password" class="form-control" minlength="6" required>
          <div class="form-text">Mínimo 6 caracteres</div>
        </div>
        <button class="btn btn-success w-100 fw-bold" onclick="registrar()">Registrarme</button>
        <hr>
        <p class="text-center mb-0">¿Ya tienes cuenta?
          <a href="login.html" class="text-success fw-bold">Inicia sesión</a></p>
      </div>
    </div>
  </div>
</div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
<script>
  async function registrar() {
    const nombre   = document.getElementById("nombre").value.trim();
    const apellido = document.getElementById("apellido").value.trim();
    const correo   = document.getElementById("correo").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const telefono = document.getElementById("telefono").value.trim();
    const errEl    = document.getElementById("error-msg");
    errEl.classList.add("d-none");

    if (!correo.endsWith(DOMINIO_ULEAM)) {
      errEl.textContent = `Solo se permiten correos ${DOMINIO_ULEAM}`;
      errEl.classList.remove("d-none"); return;
    }
    if (!nombre || !apellido || !password) {
      errEl.textContent = "Completa todos los campos obligatorios.";
      errEl.classList.remove("d-none"); return;
    }
    try {
      const cred = await auth.createUserWithEmailAndPassword(correo, password);
      await crearUsuarioDB(cred.user.uid, {
        nombre, apellido, correo, telefono, rol: "cliente"
      });
      window.location.href = "catalogo.html";
    } catch (e) {
      if (e.code === "auth/email-already-in-use")
        errEl.textContent = "Este correo ya está registrado.";
      else errEl.textContent = "Error al registrar: " + e.message;
      errEl.classList.remove("d-none");
    }
  }
</script>
</body></html>
